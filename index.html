<html lang="es">
<head>
<meta charset="UTF-8">

<title>Supervielle — Familia (loading)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%;
    background:#e9e9ee;
    display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  .phone-wrap { width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:16px; }
  .screen {
    position:relative;
    width:360px;
    aspect-ratio:360/800;
    max-height:94vh;
    background:linear-gradient(180deg,#FFFFFF 0%,#F2F2F7 100%);
    border-radius:36px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
  }
  .stage { position:absolute; inset:0; overflow:hidden; }

  /* ---------- Background rings ---------- */
  .ring {
    position:absolute;
    border:1px solid #2497F9;
    border-radius:50%;
    opacity:0;
    scale:0.94;
    transform-origin:center;
  }
  .ring.show {
    animation:
      ringGrow 1.5s cubic-bezier(.3,.1,.3,1) var(--wdelay,0s) infinite,
      ringFade 1.5s ease-in-out var(--wdelay,0s) infinite;
  }
  @keyframes ringGrow {
    0%   { scale:0.9; }
    100% { scale:1.14; }
  }
  @keyframes ringFade {
    0%   { opacity:0; }
    35%  { opacity:0.4; }
    100% { opacity:0; }
  }

  /* ---------- Blur blobs ---------- */
  .blob {
    position:absolute;
    border-radius:50%;
    opacity:0;
  }
  .blob.show { animation: blobBounceIn 0.9s ease forwards, floatY 6s ease-in-out infinite; }
  @keyframes blobBounceIn {
    0%   { opacity:0; scale:0.4; }
    55%  { opacity:var(--blob-op,0.3); scale:1.1; }
    75%  { opacity:var(--blob-op,0.3); scale:0.96; }
    100% { opacity:var(--blob-op,0.3); scale:1; }
  }
  @keyframes floatY {
    0%, 100% { transform:translate(0,0); }
    50%      { transform:translate(var(--fx,4px), var(--fy,-8px)); }
  }

  /* ---------- Center couple ---------- */
  .center-backdrop {
    position:absolute;
    left:32.311%; top:42.008%;
    width:35.52%; height:15.984%;
    opacity:0;
    scale:0.4;
  }
  .center-backdrop svg { width:100%; height:100%; display:block; }
  .center-backdrop.show { animation: bounceIn 0.6s ease forwards, centerPulse 2.6s ease-in-out 0.6s infinite; }
  @keyframes centerPulse {
    0%, 100% { filter:brightness(1); }
    50%      { filter:brightness(1.12); }
  }
  @keyframes bounceIn {
    0%   { opacity:0; scale:0.4; }
    55%  { opacity:1; scale:1.1; }
    75%  { opacity:1; scale:0.96; }
    100% { opacity:1; scale:1; }
  }

  .avatar-box { position:absolute; overflow:hidden; }
  .avatar-box canvas { width:100%; height:100%; display:block; }

  #adultoBox { left:48.25%; top:46.28%; width:16.5%; height:7.43%; transform-origin:11% 50%; z-index:3; opacity:0; scale:0.4; border-radius:50%; overflow:hidden; -webkit-mask-image:radial-gradient(circle closest-side, #000 99%, transparent 100%); mask-image:radial-gradient(circle closest-side, #000 99%, transparent 100%); }
  #adultaBox { left:35.05%; top:45.83%; width:18.5%; height:8.33%; transform-origin:86.5% 50%; z-index:2; opacity:0; scale:0.4; border-radius:50%; overflow:hidden; -webkit-mask-image:radial-gradient(circle closest-side, #000 99%, transparent 100%); mask-image:radial-gradient(circle closest-side, #000 99%, transparent 100%); }
  #adultoBox.show, #adultaBox.show {
    animation: bounceIn 0.6s ease forwards, centerPulse 2.6s ease-in-out 0.6s infinite;
  }


  /* ---------- Satellite avatars ---------- */
  .satellite {
    position:absolute;
    border-radius:50%;
    box-sizing:border-box;
    overflow:hidden;
    -webkit-mask-image:radial-gradient(circle closest-side, #000 99%, transparent 100%);
    mask-image:radial-gradient(circle closest-side, #000 99%, transparent 100%);
  }
  .satellite-ring {
    position:absolute; inset:0;
    border-radius:50%;
  }
  .satellite .avatar-box {
    position:absolute; inset:0;
    border-radius:50%;
    overflow:hidden;
    -webkit-mask-image:radial-gradient(circle closest-side, #000 99%, transparent 100%);
    mask-image:radial-gradient(circle closest-side, #000 99%, transparent 100%);
  }
  .satellite { opacity:0; scale:0.5; }

  #abuela   { left:8.145%;  top:60.929%;  width:23.56%;  height:10.602%;  background:radial-gradient(circle at 40% 30%, #FFE8C9, #F0A540); }
  #nina     { left:73.927%;    top:71.666%;    width:18.014%;    height:8.106%;    background:radial-gradient(circle at 40% 30%, #FFE6D6, #9441C1); }

  .satellite.show { animation: satIn 0.5s ease forwards, satFloat var(--fdur,5s) ease-in-out var(--fdelay,1.2s) infinite; }

  /* ---------- Exit transition: subtle bounce, no opacity fade, everyone leaves together ---------- */
  @keyframes elementExitBounce {
    0%   { scale:1; }
    35%  { scale:1.08; }
    100% { scale:0; }
  }
  @keyframes centerExitShrink {
    0%   { scale:1; }
    30%  { scale:0.92; }
    100% { scale:0; }
  }
  .satellite.exit {
    opacity:1 !important;
    animation: elementExitBounce 0.6s cubic-bezier(.4,0,.7,1) forwards !important;
  }
  #adultoBox.exit,
  #adultaBox.exit,
  .center-backdrop.exit {
    opacity:1 !important;
    animation: centerExitShrink 0.6s cubic-bezier(.4,0,.7,1) forwards !important;
  }
  .ring.exit {
    opacity:0.15 !important;
    animation: elementExitBounce 0.6s cubic-bezier(.4,0,.7,1) forwards !important;
  }
  @keyframes satIn { to { opacity:1; scale:1; } }
  @keyframes satFloat {
    0%, 100% { translate:0 0; }
    50%      { translate:var(--sfx,3px) var(--sfy,-6px); }
  }

  /* ---------- Money paper plane ---------- */
  #plane {
    position:absolute;
    left:38.634%; top:38.53%;
    width:26%; height:7.8%;
    translate:-50% -50%;
    rotate:-25deg;
    scale:0;
    opacity:0;
    z-index:6;
    pointer-events:none;
  }
  #plane canvas { width:100%; height:100%; display:block; }
  @keyframes planeFly {
    0%   { scale:0;   opacity:0; }
    20%  { scale:1.2; opacity:1; }
    32%  { scale:1;   opacity:1; }
    78%  { scale:1;   opacity:1; }
    100% { scale:0;   opacity:0.5; }
  }
  #plane.flying { animation: planeFly 1.6s cubic-bezier(.3,.1,.3,1) forwards; }

  /* ---------- Bubbles ---------- */
  .bubble {
    position:absolute;
    width:58%;
    transform:translate(var(--bx,-50%),-50%) scale(0.35);
    opacity:0;
    pointer-events:none;
    z-index:7;
    container-type:inline-size;
  }
  .bubble img, .bubble svg { width:100%; height:auto; display:block; }
  .bubble-emoji { position:absolute; left:9%; top:19%; font-size:8cqw; line-height:1; pointer-events:none; }
  #bubbleSolicito { left:50.07%; top:36.8%; }
  #bubbleEnviado  { left:78.38%;   top:15.8%; --bx:-66%; width:52%; }
  .bubble.show { animation:bubbleIn 0.5s cubic-bezier(.34,1.56,.64,1) forwards; }
  .bubble.hide { animation:bubbleOut 0.4s cubic-bezier(.5,-0.2,.7,.3) forwards; }
  @keyframes bubbleIn {
    0%   { opacity:0; transform:translate(var(--bx,-50%),-50%) scale(0.35); }
    55%  { opacity:1; transform:translate(var(--bx,-50%),-50%) scale(1.12); }
    75%  { transform:translate(var(--bx,-50%),-50%) scale(0.94); }
    100% { opacity:1; transform:translate(var(--bx,-50%),-50%) scale(1); }
  }
  @keyframes bubbleOut {
    0%   { opacity:1; transform:translate(var(--bx,-50%),-50%) scale(1); }
    30%  { transform:translate(var(--bx,-50%),-50%) scale(1.08); }
    100% { opacity:0; transform:translate(var(--bx,-50%),-50%) scale(0.35); }
  }

  /* ---------- Niño arrival ripple ---------- */
  .nino-ripple {
    position:absolute; inset:-15%;
    border-radius:50%;
    border:3px solid #B8D400;
    opacity:0;
  }
  .nino-ripple.animate { animation:ninoRipple 0.9s ease-out; }
  @keyframes ninoRipple {
    0%   { opacity:0.55; transform:scale(0.85); }
    100% { opacity:0; transform:scale(1.5); }
  }
</style>
</head>
<body>
<div class="phone-wrap">
  <div class="screen">
    <div class="stage" id="stage">

      <!-- background rings -->
      <div class="ring" id="ring1" style="left:15.25%; top:34.362%; width:69.501%; height:31.275%; --wdelay:0s;"></div>

  };
  Object.values(players).forEach(p => p.start());

  // ---------- Entrance sequence ----------
  function el(id) { return document.getElementById(id); }

  // 1) couple in the center, 2) satellites one by one, 3) only once satellites are
  // fully settled do the 4 rings appear and start their small->large pulse loop
  const SATELLITE_ORDER = ['abuelo','nino','abuela','nina'];
  const RING_ORDER = ['ring1','ring2','ring3','ring4'];
  const REST_START = 100;
  const STAGGER = 80;

  function runEntrance() {
    // 1) the adults bounce in first, together
    el('centerBackdrop').classList.add('show');
    el('adultoBox').classList.add('show');
    el('adultaBox').classList.add('show');

    // 2) then the satellite avatars, one by one, each with its own subtle bounce
    SATELLITE_ORDER.forEach((id, i) => {
      setTimeout(() => el(id).classList.add('show'), REST_START + i * STAGGER);
    });

    const satellitesSettledAt = REST_START + (SATELLITE_ORDER.length - 1) * STAGGER + 500;

    // 3) only after every avatar has finished appearing do the waves come out,
    // smallest first, and start pulsing in their small->large loop
    RING_ORDER.forEach((id, i) => {
      setTimeout(() => el(id).classList.add('show'), satellitesSettledAt);
    });

    // bubbles wait for all the avatars (not the rings) to be fully settled
    setTimeout(startMoneyLoop, satellitesSettledAt + 60);
  }

  window.addEventListener('load', () => {
    setTimeout(runEntrance, 50);
  });

  // ---------- Exit transition + loop back to entrance ----------
  function exitScene() {
    const exitOrder = ['nina','abuela','nino','abuelo','ring4','ring3','ring2','ring1','adultaBox','adultoBox','centerBackdrop'];
    // everyone bounces out together, no stagger
    exitOrder.forEach(id => {
      const e = el(id);
      e.classList.remove('show');
      e.classList.add('exit');
    });

    // no loop: the elements stay collapsed after the exit
  }

  // ---------- Bubble + money loop ----------
  function startMoneyLoop() {
    cycle();
  }

  function cycle() {
    const bubbleSolicito = el('bubbleSolicito');
    const bubbleEnviado = el('bubbleEnviado');
    const plane = el('plane');
    const ninoRipple = el('ninoRipple');

    bubbleSolicito.classList.remove('hide');
    bubbleSolicito.classList.add('show');

    setTimeout(() => {
      bubbleSolicito.classList.remove('show');
      bubbleSolicito.classList.add('hide');
    }, 500);

    setTimeout(() => {
      // launch the paper plane from the center and fly it straight to the niño --
      // scale/opacity are driven by the .flying keyframe (0% -> 120% -> 100% -> 0% on arrival),
      // position is driven separately so the two never fight over the transform property.
      planePlayer.start();
      plane.classList.remove('flying');
      plane.style.transition = 'none';
      plane.style.left = '50.07%';
      plane.style.top = '42.0%';
      void plane.offsetWidth;

      // arrive at the edge of the niño's green circle, not on top of his face
      plane.style.transition = 'left 1.6s cubic-bezier(.35,.05,.3,1), top 1.6s cubic-bezier(.35,.05,.3,1)';
      plane.style.left = '73.25%';
      plane.style.top = '27.41%';
      void plane.offsetWidth;
      plane.classList.add('flying');

      // sync the niño's own video so his built-in "$" gesture (clearest at ~2.6s into
      // his clip) lands exactly when the plane arrives, 1.6s from now
      players.nino.video.currentTime = 1.0;

      setTimeout(() => {
        plane.classList.remove('flying');
        planePlayer.stop();
        ninoRipple.classList.remove('animate');
        void ninoRipple.offsetWidth;
        ninoRipple.classList.add('animate');
        bubbleEnviado.classList.remove('hide');
        bubbleEnviado.classList.add('show');
      }, 1600);
    }, 450);

    setTimeout(() => {
      bubbleEnviado.classList.remove('show');
      bubbleEnviado.classList.add('hide');
    }, 3550);

    // once the niño has received the money and the bubble has hidden, everything
    // exits together, then the whole scene bounces back in and the cycle repeats
    setTimeout(exitScene, 3950);
  }
</script>
