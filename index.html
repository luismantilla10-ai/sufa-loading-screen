<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%;
    margin:0;
    font-family:-apple-system,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
  }
  /* same gradient across the whole viewport: no phone frame, no visible edges */
  html { background:linear-gradient(180deg,#FFFFFF 0%,#F2F2F7 100%); }
  body { background:transparent; }
  /* full-viewport wrapper; the 360x800 scene is scaled (never stretched) to fit any screen */
  .phone-wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .screen {
    position:relative; flex:none;
    --f:1; --u:1px;
    width:calc(360 * var(--u)); height:calc(800 * var(--u));
  }
  .stage { position:absolute; inset:0; }

  /* ---------- Background rings ---------- */
  .ring {
    position:absolute;
    border:1px solid #2497F9;
    border-radius:50%;
    opacity:0;
    scale:0.94;
    transform-origin:center;
  }
  .ring.show {
    animation:
      ringGrow 1.5s cubic-bezier(.3,.1,.3,1) var(--wdelay,0s) infinite,
      ringFade 1.5s ease-in-out var(--wdelay,0s) infinite;
  }
  @keyframes ringGrow {
    0%   { scale:0.9; }
    100% { scale:1.14; }
  }
  @keyframes ringFade {
    0%   { opacity:0; }
    35%  { opacity:0.4; }
    100% { opacity:0; }
  }


  /* ---------- Hub (centre of the scene) + spheres ---------- */
  .hub { position:absolute; left:50%; top:50%; width:0; height:0; z-index:5; }
  .orbit { position:absolute; left:0; top:0; width:0; height:0; z-index:1; }
  .av {
    position:absolute; left:0; top:0;
    width:calc(78 * var(--u)); height:calc(78 * var(--u)); margin:calc(-39 * var(--u)) 0 0 calc(-39 * var(--u));
    translate:calc(var(--cx) * var(--u)) calc(var(--cy) * var(--u));
  }
  .avc { width:100%; height:100%; }
  .sphere {
    position:relative; width:100%; height:100%;
    border-radius:50%; overflow:hidden;
    opacity:0; scale:0.5;
    box-shadow:inset 0 0 0 calc(2.2 * var(--u)) #fff;
  }
  .sphere canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .s-adulto { background:radial-gradient(circle closest-side at 50% 50%, #8FB3F5 0%, #4479F0 100%); }
  .s-adulta { background:radial-gradient(circle closest-side at 50% 50%, #FFC7C7 0%, #D17E7E 100%); }
  .s-abuelo { background:radial-gradient(circle closest-side at 50% 50%, #D5F8FF 0%, #127FAD 100%); }
  .s-abuela { background:radial-gradient(circle closest-side at 50% 50%, #FFE8C9 0%, #F0A540 100%); }
  .s-nina   { background:radial-gradient(circle closest-side at 50% 50%, #FFE6D6 0%, #9441C1 100%); }
  .s-nino   { background:radial-gradient(circle closest-side at 50% 50%, #E3FE35 0%, #CEE729 24%, #B7CF1C 48%, #A1B710 73%, #8FA406 91%, #8FA406 100%); }

  /* 1) all six pop in together, clustered around the button (subtle bounce) */
  @keyframes popIn {
    0%   { opacity:0; scale:0.5; }
    60%  { opacity:1; scale:1.06; }
    80%  { opacity:1; scale:0.98; }
    100% { opacity:1; scale:1; }
  }
  .sphere.show { animation:popIn 0.6s ease forwards; }

  /* 2) they separate to the ring positions... */
  @keyframes avSpread {
    from { translate:calc(var(--cx) * var(--u)) calc(var(--cy) * var(--u)); }
    to   { translate:calc(var(--sx) * var(--u)) calc(var(--sy) * var(--u)); }
  }
  .av.spread { animation:avSpread 0.9s cubic-bezier(.25,1.12,.4,1) forwards; }

  /* 3) ...and orbit gently around the button; faces are counter-rotated so they stay upright */
  @keyframes orbitSpin   { from { rotate:0deg; } to { rotate:60deg; } }
  @keyframes orbitUnspin { from { rotate:0deg; } to { rotate:-60deg; } }
  .orbit.spin { animation:orbitSpin 4.35s cubic-bezier(.45,.05,.35,1) forwards; }
  .orbit.spin .avc { animation:orbitUnspin 4.35s cubic-bezier(.45,.05,.35,1) forwards; }

  /* ---------- Green + button and its pulse ---------- */
  .btn {
    position:absolute; left:calc(-35.4 * var(--u)); top:calc(-37.5 * var(--u)); width:calc(75 * var(--u)); height:calc(75 * var(--u));
    z-index:10; opacity:0; scale:0.5; transform-origin:47.2% 50%;
  }
  .btn.show { animation:popIn 0.5s ease forwards; }
  .btnp { position:relative; width:100%; height:100%; transform-origin:47.2% 50%; }
  .btn-glow { position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle closest-side, rgba(50,171,111,0.40) 0%, rgba(50,171,111,0.40) 55%, rgba(50,171,111,0.20) 66.5%, rgba(50,171,111,0.064) 83%, rgba(50,171,111,0.005) 98%, rgba(50,171,111,0) 100%); }
  .btnp svg { position:relative; width:100%; height:100%; display:block; overflow:visible; }
  @keyframes btnPress {
    0%   { scale:1; }
    25%  { scale:0.84; }
    60%  { scale:1.07; }
    100% { scale:1; }
  }
  .btnp.press { animation:btnPress 0.55s ease; }
  @keyframes btnOut {
    0%   { scale:1; }
    30%  { scale:1.08; }
    100% { scale:0; }
  }
  .btn.gone { opacity:1; animation:btnOut 0.4s cubic-bezier(.4,0,.7,1) forwards; }
  .pulse {
    position:absolute; left:calc(-25 * var(--u)); top:calc(-25 * var(--u)); width:calc(50 * var(--u)); height:calc(50 * var(--u)); border-radius:50%;
    background:radial-gradient(circle closest-side, rgba(52,216,134,0.55) 0%, rgba(52,216,134,0.30) 65%, rgba(52,216,134,0) 100%);
    opacity:0; scale:1; z-index:0; pointer-events:none;
  }
  .pulse.go { animation:greenPulse 0.95s cubic-bezier(.2,.6,.3,1) forwards; }
  @keyframes greenPulse {
    0%   { opacity:0.6; scale:1; }
    100% { opacity:0;   scale:3.8; }
  }

  /* ---------- Exit: subtle bounce, no opacity fade, everyone leaves together (same as v2) ---------- */
  @keyframes elementExitBounce {
    0%   { scale:1; }
    35%  { scale:1.08; }
    100% { scale:0; }
  }
  .sphere.exit, .btn.exit {
    opacity:1 !important;
    animation:elementExitBounce 0.6s cubic-bezier(.4,0,.7,1) forwards !important;
  }
  .ring.exit {
    opacity:0.15 !important;
    animation:elementExitBounce 0.6s cubic-bezier(.4,0,.7,1) forwards !important;
  }
</style>

      const halfW = video.videoWidth / 2;
      const h = video.videoHeight;

      const rgbData = workCtx.getImageData(0, 0, halfW, h);
      workCtx.drawImage(video, halfW, 0, halfW, h, 0, 0, halfW, h);

      for (let i = 0; i < rgbData.data.length; i += 4) {
        out.data[i] = rgbData.data[i];
        out.data[i+1] = rgbData.data[i+1];
        out.data[i+2] = rgbData.data[i+2];
        out.data[i+3] = alphaData.data[i];

          // stepping down by halves so faces/edges stay smooth instead of aliasing when shrunk

            const probe = ctx.getImageData(0, 0, dw, dh).data;

  };
  Object.values(players).forEach(p => p.start());
  ['pointerdown','touchstart','click','keydown'].forEach(ev => document.addEventListener(ev, () => {
    Object.values(players).forEach(p => { if (p.video.paused) p.video.play().catch(() => {}); });
  }, { passive: true }));

  function el(id) { return document.getElementById(id); }
  const NAMES = ['adulto','nina','nino','adulta','abuela','abuelo'];
  const RING_ORDER = ['ring1','ring2','ring3','ring4'];

  // Timeline (ms from the start of the entrance) -- total length identical to v2: exit at 6050, gone by 6650
  //   0     green button bounces in
  //   500   button is pressed + green pulse in the background
  //   800   the six avatars pop in together, clustered
  //   840   waves start (unchanged from v2)
  //   1400  avatars have appeared -> the button disappears (subtle bounce)
  //   1700  avatars separate and begin a gentle orbit (until 6050)
  //   6050  everything bounces out
  function runEntrance() {
    el('btn').classList.add('show');
    setTimeout(() => { el('btnp').classList.add('press'); el('pulse').classList.add('go'); }, 500);
    setTimeout(() => NAMES.forEach(n => el('sph-' + n).classList.add('show')), 800);
    // the avatars have finished appearing -> the button disappears
    setTimeout(() => { const b = el('btn'); b.classList.remove('show'); b.classList.add('gone'); }, 1400);
    RING_ORDER.forEach(id => setTimeout(() => el(id).classList.add('show'), 840));
    setTimeout(() => {
      NAMES.forEach(n => el('av-' + n).classList.add('spread'));
      el('orbit').classList.add('spin');
    }, 1700);
    setTimeout(exitScene, 6050);
  }

  function exitScene() {
    const ids = [...NAMES.map(n => 'sph-' + n), 'ring4', 'ring3', 'ring2', 'ring1'];
    ids.forEach(id => { const e = el(id); e.classList.remove('show'); e.classList.add('exit'); });
    // no loop: everything stays collapsed after the exit
  }

  window.addEventListener('load', () => setTimeout(runEntrance, 50));
</script>
